<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Times Square map has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://mystery-maps.pages.dev/">
<meta http-equiv="refresh" content="0; url=https://mystery-maps.pages.dev/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; font: 18px/1.5 Georgia, serif; color: #3a2616; background: #ead9ae; }
  a { color: #9c2f27; }
</style>
</head>
<body>
  <main>
    <h1>The Times Square map has moved</h1>
    <p>It now lives at <a href="https://mystery-maps.pages.dev/">Mystery Maps</a>.</p>
  </main>
  <script>
    // The old map installed an offline copy of itself on visitors' devices. Remove it, then go to the new home.
    (function () {
      var go = function () { window.location.replace('https://mystery-maps.pages.dev/'); };
      try {
        var jobs = [];
        if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('tsmap') === 0; }).map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).then(go, go);
        setTimeout(go, 1500);
      } catch (e) { go(); }
    })();
  </script>
</body>
</html>
