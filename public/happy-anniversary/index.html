<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Happy Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ecdfc0;
    --paper-deep:#e0cea0;
    --ink:#3a2818;
    --ink-soft:#6b4e34;
    --accent:#7c2a2a;
    --gold:#a9822f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at center, #2a1d13 0%, #120c08 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 14px;
    font-family:'EB Garamond', serif;
  }
  .sheet{
    position:relative;
    width:min(880px, 100%);
    background:
      radial-gradient(circle at 14% 18%, rgba(120,90,40,0.16), transparent 40%),
      radial-gradient(circle at 86% 78%, rgba(120,90,40,0.13), transparent 45%),
      radial-gradient(circle at 60% 8%, rgba(90,60,20,0.10), transparent 35%),
      radial-gradient(circle at 30% 90%, rgba(90,60,20,0.10), transparent 40%),
      var(--paper);
    box-shadow:0 30px 70px rgba(0,0,0,0.55);
    border:3px solid var(--ink);
    padding:10px;
    animation:reveal 1.1s ease-out both;
  }
  .frame{
    position:relative;
    border:1px solid var(--gold);
    padding:34px 30px 26px;
  }
  .corner{position:absolute; width:44px; height:44px; color:var(--gold); opacity:0.85;}
  .corner.tl{top:6px; left:6px;}
  .corner.tr{top:6px; right:6px; transform:scaleX(-1);}
  .corner.bl{bottom:6px; left:6px; transform:scaleY(-1);}
  .corner.br{bottom:6px; right:6px; transform:scale(-1,-1);}

  .title-block{text-align:center; margin-bottom:22px;}
  h1{
    font-family:'Cinzel Decorative', serif;
    font-size:clamp(1.9rem, 5vw, 3rem);
    color:var(--accent);
    letter-spacing:2px;
    margin:0;
    text-shadow:1px 1px 0 rgba(0,0,0,0.12);
  }
  .subtitle{
    font-style:italic;
    color:var(--ink-soft);
    letter-spacing:0.5px;
    margin:8px 0 0;
    font-size:1.05rem;
  }
  .divider{display:block; width:260px; height:16px; margin:14px auto 0; color:var(--gold);}

  .plates{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:26px 22px;
    margin:26px 0 30px;
  }
  .plate{text-align:center; margin:0;}
  .plate-frame{
    border:1px solid var(--ink-soft);
    background:var(--paper-deep);
    padding:8px;
    box-shadow:inset 0 0 14px rgba(0,0,0,0.10);
  }
  .plate-frame svg{width:100%; height:auto; display:block; color:var(--ink);}
  figcaption{margin-top:10px;}
  .plate-number{
    display:block;
    font-family:'Cinzel Decorative', serif;
    font-size:0.72rem;
    letter-spacing:2.5px;
    color:var(--accent);
    margin-bottom:3px;
  }
  blockquote{
    margin:4px 6px 0;
    font-style:italic;
    font-size:0.86rem;
    color:var(--ink-soft);
    line-height:1.45;
  }
  .caption-line{
    margin:4px 6px 0;
    font-style:italic;
    font-size:0.86rem;
    color:var(--ink-soft);
  }

  .closing{text-align:center; margin-top:6px;}
  .wax-seal{width:60px; height:60px; margin:0 auto 8px; color:var(--accent);}
  .closing p{
    font-style:italic;
    color:var(--ink-soft);
    font-size:1.02rem;
    margin:0 auto;
    max-width:420px;
    line-height:1.5;
  }

  @keyframes reveal{
    from{opacity:0; transform:scale(0.97) translateY(12px);}
    to{opacity:1; transform:scale(1) translateY(0);}
  }
  @keyframes twinkle{
    0%,100%{opacity:0.35; transform:scale(0.85);}
    50%{opacity:1; transform:scale(1.05);}
  }
  @keyframes flicker{
    0%,100%{transform:scaleY(1) scaleX(1); opacity:1;}
    25%{transform:scaleY(1.08) scaleX(0.94); opacity:0.9;}
    50%{transform:scaleY(0.92) scaleX(1.06); opacity:1;}
    75%{transform:scaleY(1.05) scaleX(0.97); opacity:0.94;}
  }
  @keyframes moonglow{
    0%,100%{filter:drop-shadow(0 0 3px rgba(255,255,255,0.35));}
    50%{filter:drop-shadow(0 0 9px rgba(255,255,255,0.7));}
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
  }
  @keyframes wag{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(10deg);}
  }
  @keyframes notefloat{
    0%,100%{transform:translateY(0); opacity:0.55;}
    50%{transform:translateY(-6px); opacity:0.85;}
  }
  use[href="#s-star"]{transform-box:fill-box; transform-origin:center; animation:twinkle 2.3s ease-in-out infinite;}
  use[href="#s-candle"]{transform-box:fill-box; transform-origin:center bottom; animation:flicker 1.9s ease-in-out infinite;}
  use[href="#s-moon"]{transform-box:fill-box; transform-origin:center; animation:moonglow 3.2s ease-in-out infinite;}
  .broom-fly{animation:bob 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  .tail{transform-box:fill-box; transform-origin:0% 50%; animation:wag 2.1s ease-in-out infinite;}
  .note-float{transform-box:fill-box; transform-origin:center; animation:notefloat 2.4s ease-in-out infinite;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  @media (max-width:560px){
    .plates{grid-template-columns:1fr;}
  }
  @media print{
    body{background:#fff; padding:0;}
    .sheet{box-shadow:none;}
  }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
<defs>

    <circle cx="92" cy="8" r="5" fill="currentColor"/>

    <circle cx="40" cy="40" r="37" fill="currentColor"/>

</svg>

<div class="sheet">
  <div class="frame">
    <svg class="corner tl" viewBox="0 0 100 100"><use href="#s-flourish"/></svg>
    <svg class="corner tr" viewBox="0 0 100 100"><use href="#s-flourish"/></svg>
    <svg class="corner bl" viewBox="0 0 100 100"><use href="#s-flourish"/></svg>
    <svg class="corner br" viewBox="0 0 100 100"><use href="#s-flourish"/></svg>

    <header class="title-block">
      <h1>Happy Anniversary</h1>
      <p class="subtitle">Archana &amp; K K &mdash; Till the End of Time</p>
      <svg class="divider" viewBox="0 0 300 20">
        <line x1="0" y1="10" x2="128" y2="10" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="150" cy="10" r="4" fill="currentColor"/>
        <line x1="172" y1="10" x2="300" y2="10" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </header>

    <div class="plates">

      <figure class="plate">
        <div class="plate-frame">
          <svg viewBox="0 0 300 220">
            <use href="#s-moon" x="230" y="10" width="42" height="42"/>
            <use href="#s-star" x="200" y="24" width="10" height="10" opacity="0.7"/>
            <use href="#s-star" x="260" y="58" width="8" height="8" opacity="0.55"/>
            <use href="#s-owl" x="20" y="18" width="42" height="42"/>
            <rect x="0" y="55" width="90" height="4" fill="currentColor" opacity="0.5"/>
            <rect x="118" y="150" width="64" height="8" fill="currentColor"/>
            <rect x="146" y="158" width="8" height="30" fill="currentColor"/>
            <use href="#s-candle" x="130" y="95" width="16" height="55"/>
            <rect x="100" y="140" width="12" height="12" rx="2" fill="currentColor"/>
            <rect x="188" y="140" width="12" height="12" rx="2" fill="currentColor"/>
            <g transform="translate(95,150)">
              <circle cx="0" cy="-56" r="13" fill="currentColor"/>
              <path d="M-20,-40 C-27,-12 -25,16 -18,36 L18,36 C25,16 27,-12 20,-40 C9,-48 -9,-48 -20,-40 Z" fill="currentColor"/>
              <path d="M16,-28 C26,-22 28,-14 24,-6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            </g>
            <g transform="translate(205,150) scale(-1,1)">
              <circle cx="0" cy="-56" r="13" fill="currentColor"/>
              <path d="M-20,-40 C-27,-12 -25,16 -18,36 L18,36 C25,16 27,-12 20,-40 C9,-48 -9,-48 -20,-40 Z" fill="currentColor"/>
              <path d="M16,-28 C26,-22 28,-14 24,-6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
        <figcaption>
          <span class="plate-number">Plate I</span>
          <blockquote>&ldquo;Don't worry, I'll go easy on you&nbsp;&mdash; we just met.&rdquo;<br>&ldquo;Let's see where this goes.&rdquo;</blockquote>
        </figcaption>
      </figure>

      <figure class="plate">
        <div class="plate-frame">
          <svg viewBox="0 0 300 220">
            <rect x="30" y="20" width="240" height="6" fill="currentColor" opacity="0.5"/>
            <line x1="34" y1="20" x2="34" y2="170" stroke="currentColor" stroke-width="5" opacity="0.5"/>
            <line x1="266" y1="20" x2="266" y2="170" stroke="currentColor" stroke-width="5" opacity="0.5"/>
            <path d="M34,26 Q60,50 34,80" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"/>
            <path d="M266,26 Q240,50 266,80" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"/>
            <rect x="40" y="150" width="220" height="20" rx="4" fill="currentColor"/>
            <rect x="40" y="140" width="220" height="14" fill="currentColor" opacity="0.85"/>
            <g transform="translate(110,146)">
              <circle cx="0" cy="-14" r="12" fill="currentColor"/>
              <path d="M-14,-2 C-20,4 -18,14 0,16 C18,14 20,4 14,-2 C6,-8 -6,-8 -14,-2 Z" fill="currentColor"/>
            </g>
            <g transform="translate(190,146) scale(-1,1)">
              <circle cx="0" cy="-14" r="12" fill="currentColor"/>
              <path d="M-14,-2 C-20,4 -18,14 0,16 C18,14 20,4 14,-2 C6,-8 -6,-8 -14,-2 Z" fill="currentColor"/>
            </g>
            <use href="#s-book" x="130" y="95" width="44" height="30"/>
            <use href="#s-candle" x="60" y="90" width="14" height="46"/>
            <use href="#s-candle" x="230" y="90" width="14" height="46"/>
            <use href="#s-star" x="145" y="70" width="10" height="10" opacity="0.6"/>
          </svg>
        </div>
        <figcaption>
          <span class="plate-number">Plate II</span>
          <p class="caption-line">Two desks were never needed.</p>
        </figcaption>
      </figure>

      <figure class="plate">
        <div class="plate-frame">
          <svg viewBox="0 0 300 220">
            <ellipse cx="60" cy="190" rx="50" ry="16" fill="currentColor" opacity="0.15"/>
            <rect x="20" y="140" width="80" height="60" fill="currentColor" opacity="0.08"/>
            <use href="#s-star" x="180" y="30" width="10" height="10" opacity="0.5"/>
            <path d="M210,50 q6,-14 14,-4" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6"/>
            <circle class="note-float" cx="210" cy="52" r="4" fill="currentColor" opacity="0.6"/>
            <circle class="note-float" cx="222" cy="44" r="4" fill="currentColor" opacity="0.6"/>
            <g transform="translate(150,150)">
              <circle cx="0" cy="-70" r="13" fill="currentColor"/>
              <path d="M-16,-54 C-22,-24 -20,10 -14,44 L14,44 C20,10 22,-24 16,-54 C8,-62 -8,-62 -16,-54 Z" fill="currentColor"/>
              <path d="M14,-50 C26,-56 34,-50 40,-56" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
              <path d="M40,-56 L58,-64 L54,-50 Z" fill="currentColor"/>
            </g>
            <g transform="translate(230,168) scale(-1,1)">
              <circle cx="0" cy="-50" r="12" fill="currentColor"/>
              <path d="M-16,-36 C-22,-14 -20,10 -14,30 L14,30 C20,10 22,-14 16,-36 C8,-42 -8,-42 -16,-36 Z" fill="currentColor"/>
              <path d="M12,-24 C20,-20 22,-14 18,-8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
        <figcaption>
          <span class="plate-number">Plate III</span>
          <p class="caption-line">Every wrong note, right together.</p>
        </figcaption>
      </figure>

      <figure class="plate">
        <div class="plate-frame">
          <svg viewBox="0 0 300 220">
            <use href="#s-castle" x="0" y="120" width="300" height="90" opacity="0.9"/>
            <use href="#s-moon" x="230" y="10" width="40" height="40"/>
            <use href="#s-star" x="60" y="20" width="10" height="10" opacity="0.6"/>
            <use href="#s-star" x="110" y="40" width="8" height="8" opacity="0.5"/>
            <rect x="0" y="160" width="300" height="10" fill="currentColor" opacity="0.7"/>
            <g transform="translate(140,160)">
              <circle cx="0" cy="-46" r="12" fill="currentColor"/>
              <path d="M-14,-32 C-18,-14 -10,4 8,6 L16,-2 C18,-14 12,-28 2,-34 C-4,-36 -10,-35 -14,-32 Z" fill="currentColor"/>

            </g>
            <g transform="translate(190,164)">

              <path d="M-16,-44 C-22,-16 -20,16 -14,40 L14,40 C20,16 22,-16 16,-44 C8,-52 -8,-52 -16,-44 Z" fill="currentColor"/>
              <path d="M-12,-30 C-18,-24 -18,-16 -14,-12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              <path d="M12,-30 C18,-24 18,-16 14,-12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
        <figcaption>
          <span class="plate-number">Plate IV</span>
          <blockquote>&ldquo;Marry me?&rdquo;</blockquote>
        </figcaption>
      </figure>

      <figure class="plate">
        <div class="plate-frame">
          <svg viewBox="0 0 300 220">
            <use href="#s-castle" x="10" y="150" width="180" height="60" opacity="0.6"/>
            <ellipse cx="150" cy="205" rx="140" ry="10" fill="currentColor" opacity="0.15"/>
            <use href="#s-star" x="230" y="20" width="10" height="10" opacity="0.6"/>
            <use href="#s-star" x="260" y="50" width="8" height="8" opacity="0.5"/>
            <use href="#s-moon" x="20" y="15" width="36" height="36"/>
            <g class="broom-fly">
            <g transform="translate(170,110) rotate(-8)">
              <use href="#s-broom" x="-10" y="30" width="110" height="34"/>
              <g transform="translate(40,10)">
                <circle cx="0" cy="-20" r="11" fill="currentColor"/>
                <path d="M-14,-8 C-18,4 -14,18 0,20 C14,18 18,4 14,-8 C7,-14 -7,-14 -14,-8 Z" fill="currentColor"/>
              </g>
              <g transform="translate(8,16)">
                <circle cx="0" cy="-20" r="11" fill="currentColor"/>
                <path d="M-14,-8 C-18,4 -14,18 0,20 C14,18 18,4 14,-8 C7,-14 -7,-14 -14,-8 Z" fill="currentColor"/>
                <path d="M12,-4 C20,0 24,6 20,14" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              </g>
            </g>
            </g>
          </svg>
        </div>
        <figcaption>
          <span class="plate-number">Plate V</span>
          <p class="caption-line">No broom needed to feel like flying.</p>
        </figcaption>
      </figure>

      <figure class="plate">
        <div class="plate-frame">
          <svg viewBox="0 0 300 220">
            <ellipse cx="150" cy="200" rx="130" ry="14" fill="currentColor" opacity="0.12"/>
            <rect x="230" y="150" width="30" height="50" fill="currentColor" opacity="0.7"/>
            <use href="#s-cauldron" x="20" y="150" width="50" height="36"/>
            <use href="#s-book" x="240" y="160" width="30" height="22"/>
            <g transform="translate(115,175)">
              <circle cx="0" cy="-40" r="12" fill="currentColor"/>
              <path d="M-20,-26 C-26,-10 -22,4 -10,8 L10,8 C22,4 26,-10 20,-26 C10,-32 -10,-32 -20,-26 Z" fill="currentColor"/>
            </g>
            <g transform="translate(185,175) scale(-1,1)">
              <circle cx="0" cy="-40" r="12" fill="currentColor"/>
              <path d="M-20,-26 C-26,-10 -22,4 -10,8 L10,8 C22,4 26,-10 20,-26 C10,-32 -10,-32 -20,-26 Z" fill="currentColor"/>
            </g>
            <use href="#s-kitten" x="128" y="150" width="44" height="44"/>
          </svg>
        </div>
        <figcaption>
          <span class="plate-number">Plate VI</span>
          <p class="caption-line">The family, now three.</p>
        </figcaption>
      </figure>

    </div>

    <footer class="closing">
      <svg class="wax-seal" viewBox="0 0 80 80"><use href="#s-seal"/></svg>
      <p>Happy Anniversary, Archana &amp; K K &mdash; here's to every ordinary night that turned into something enchanted.</p>
    </footer>
  </div>
</div>

</body>
</html>
