<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Happy Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ecdfc0;
    --paper-deep:#e5d5ac;
    --ink:#3a2818;
    --ink-soft:#6b4e34;
    --accent:#7c2a2a;
    --gold:#a9822f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at center, #2a1d13 0%, #120c08 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:44px 14px;
    font-family:'EB Garamond', serif;
    color:var(--ink);
  }
  .sheet{
    position:relative;
    width:min(940px, 100%);
    background:
      radial-gradient(circle at 14% 18%, rgba(120,90,40,0.16), transparent 40%),
      radial-gradient(circle at 86% 78%, rgba(120,90,40,0.13), transparent 45%),
      radial-gradient(circle at 60% 8%, rgba(90,60,20,0.10), transparent 35%),
      radial-gradient(circle at 30% 90%, rgba(90,60,20,0.10), transparent 40%),
      var(--paper);
    box-shadow:0 30px 70px rgba(0,0,0,0.55);
    border:3px solid var(--ink);
    padding:10px;
    animation:reveal 1.2s ease-out both;
  }
  .frame{
    position:relative;
    border:1px solid var(--gold);
    padding:38px 32px 30px;
  }
  .corner{position:absolute; width:56px; height:56px; color:var(--gold); opacity:0.9;}
  .corner.tl{top:5px; left:5px;}
  .corner.tr{top:5px; right:5px; transform:scaleX(-1);}
  .corner.bl{bottom:5px; left:5px; transform:scaleY(-1);}
  .corner.br{bottom:5px; right:5px; transform:scale(-1,-1);}

  .title-block{text-align:center; margin-bottom:26px;}
  h1{
    font-family:'Cinzel Decorative', serif;
    font-size:clamp(1.9rem, 5vw, 3.1rem);
    color:var(--accent);
    letter-spacing:2px;
    margin:0;
    text-shadow:1px 1px 0 rgba(0,0,0,0.12);
  }
  .subtitle{
    font-style:italic;
    color:var(--ink-soft);
    letter-spacing:0.5px;
    margin:10px 0 0;
    font-size:1.08rem;
  }
  .divider{display:block; width:300px; max-width:70%; height:22px; margin:16px auto 0; color:var(--gold);}

  .plates{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:30px 26px;
    margin:30px 0 34px;
  }
  .plate{text-align:center; margin:0;}
  .plate-frame{
    border:1px solid var(--ink-soft);
    background:var(--paper-deep);
    padding:7px;
    box-shadow:inset 0 0 18px rgba(58,40,24,0.13);
  }
  .plate-frame > div{border:1px solid rgba(169,130,47,0.55); padding:3px;}
  .plate-frame svg{width:100%; height:auto; display:block; color:var(--ink);}
  figcaption{margin-top:12px;}
  .plate-number{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-family:'Cinzel Decorative', serif;
    font-size:0.7rem;
    letter-spacing:2.5px;
    color:var(--accent);
    margin-bottom:5px;
  }
  .plate-number::before,.plate-number::after{
    content:"";
    height:1px; width:24px;
    background:linear-gradient(to right, transparent, var(--gold), transparent);
  }
  blockquote{
    margin:4px 6px 0;
    font-style:italic;
    font-size:0.9rem;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .caption-line{
    margin:4px 6px 0;
    font-style:italic;
    font-size:0.9rem;
    color:var(--ink-soft);
  }

  .closing{text-align:center; margin-top:8px;}
  .wax-seal{width:72px; height:72px; margin:0 auto 10px; color:var(--accent);}
  .closing p{
    font-style:italic;
    color:var(--ink-soft);
    font-size:1.04rem;
    margin:0 auto;
    max-width:440px;
    line-height:1.55;
  }

  /* ---- engraver's stroke ladder ---- */
  .s1,.s2,.s3,.s4{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
  .o1,.o2,.o3{fill:var(--paper-deep);stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
  .s1,.o1{stroke-width:2.1;}
  .s2,.o2{stroke-width:1.4;}
  .s3,.o3{stroke-width:0.9;}
  .s4{stroke-width:0.55; opacity:0.55;}
  .lp{fill:none;stroke:var(--paper-deep);stroke-width:0.9;stroke-linecap:round;}
  .fk{fill:currentColor;stroke:none;}
  .fs{fill:currentColor;stroke:none;opacity:0.5;}
  .fp{fill:var(--paper-deep);stroke:none;}
  .hx{fill:url(#p-hatch);stroke:none;}
  .hx2{fill:url(#p-hatch2);stroke:none;}
  .hs{fill:url(#p-stone);stroke:none;}
  #ink-defs{color:var(--ink);}

  @keyframes reveal{
    from{opacity:0; transform:scale(0.98) translateY(14px);}
    to{opacity:1; transform:scale(1) translateY(0);}
  }
  @keyframes twinkle{
    0%,100%{opacity:0.3; transform:scale(0.8) rotate(0deg);}
    50%{opacity:1; transform:scale(1.08) rotate(12deg);}
  }
  @keyframes flicker{
    0%,100%{transform:scaleY(1) scaleX(1); opacity:1;}
    22%{transform:scaleY(1.1) scaleX(0.92) translateX(0.2px); opacity:0.88;}
    47%{transform:scaleY(0.9) scaleX(1.07); opacity:1;}
    71%{transform:scaleY(1.06) scaleX(0.96) translateX(-0.2px); opacity:0.93;}
  }
  @keyframes moonglow{
    0%,100%{filter:drop-shadow(0 0 2px rgba(255,252,240,0.30));}
    50%{filter:drop-shadow(0 0 8px rgba(255,252,240,0.62));}
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-7px) rotate(-1.2deg);}
  }
  @keyframes wag{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(-9deg);}
  }
  @keyframes notefloat{
    0%{transform:translate(0,4px) rotate(-6deg); opacity:0;}
    22%{opacity:0.9;}
    100%{transform:translate(6px,-22px) rotate(8deg); opacity:0;}
  }
  @keyframes steam{
    0%{transform:translateY(2px) scaleY(0.9); opacity:0;}
    35%{opacity:0.7;}
    100%{transform:translateY(-12px) scaleY(1.25); opacity:0;}
  }
  .a-tw{transform-box:fill-box; transform-origin:center; animation:twinkle 2.8s ease-in-out infinite;}
  .a-fl{transform-box:fill-box; transform-origin:center bottom; animation:flicker 1.8s ease-in-out infinite;}
  .a-gl{animation:moonglow 4.4s ease-in-out infinite;}
  .a-bob{transform-box:fill-box; transform-origin:center; animation:bob 3.4s ease-in-out infinite;}
  .a-wag{transform-box:fill-box; transform-origin:0% 100%; animation:wag 2.6s ease-in-out infinite;}
  .a-note{transform-box:fill-box; transform-origin:center; animation:notefloat 3.6s ease-in-out infinite;}
  .a-steam{transform-box:fill-box; transform-origin:center bottom; animation:steam 4.4s ease-in-out infinite;}
  .d1{animation-delay:-0.45s;} .d2{animation-delay:-0.95s;} .d3{animation-delay:-1.5s;}
  .d4{animation-delay:-2.1s;} .d5{animation-delay:-2.7s;} .d6{animation-delay:-3.3s;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  @media (max-width:620px){
    .plates{grid-template-columns:1fr;}
    .frame{padding:28px 16px 22px;}
  }
  @media print{
    body{background:#fff; padding:0;}
    .sheet{box-shadow:none;}
    *{animation:none !important;}
  }
</style>
</head>
